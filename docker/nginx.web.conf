server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /health {
    add_header Content-Type text/plain;
    return 200 'ok';
  }

  location = /env.js {
    expires -1;
    add_header Cache-Control 'no-store';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
