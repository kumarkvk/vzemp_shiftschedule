version: '3.8'

services:
  # PostgreSQL Database
  postgresql:
    image: postgres:14-alpine
    container_name: ecommerce-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecommerce
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # Redis Cache (optional, for future use)
  redis:
    image: redis:7-alpine
    container_name: ecommerce-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ecommerce-network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: ecommerce-backend
    depends_on:
      postgresql:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 3000
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: ecommerce
      DB_POOL_SIZE: 10
      JWT_SECRET: dev-secret-key
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_dummy}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_dummy}
      API_CORS_ORIGIN: http://localhost:5173,http://localhost:5174
      LOG_LEVEL: debug
    ports:
      - "3000:3000"
    volumes:
      - ./packages/backend/src:/app/src
      - /app/node_modules
    networks:
      - ecommerce-network
    command: npm run dev

  # Web Frontend
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      target: dev
    container_name: ecommerce-web
    depends_on:
      - backend
    environment:
      VITE_API_URL: http://localhost:3000
      VITE_STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-pk_test_dummy}
      VITE_ENABLE_PROFILER: "false"
    ports:
      - "5173:5173"
    volumes:
      - ./packages/web:/app/packages/web
      - /app/node_modules
    networks:
      - ecommerce-network
    command: pnpm dev --host 0.0.0.0

networks:
  ecommerce-network:
    driver: bridge

volumes:
  postgres_data:
